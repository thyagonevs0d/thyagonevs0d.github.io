<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBKA Apps</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f6f5;color:#1a2a20}
  header{background:#1B8F4C;color:#fff;padding:28px 18px;text-align:center}
  header h1{margin:0;font-size:1.8rem}
  main{max-width:640px;margin:24px auto;padding:0 18px}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h2{margin:0 0 6px}
  a.btn{display:inline-block;background:#1B8F4C;color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700;margin:10px 8px 0 0}
  a.ghost{background:#fff;color:#1B8F4C;border:2px solid #1B8F4C}
  footer{text-align:center;color:#5b6b61;font-size:.9rem;margin:28px 0}
  footer a{color:#1B8F4C}
</style>
</head>
<body>
<header><h1>RBKA Apps</h1></header>
<main>
  <div class="card">
    <h2>🛒 Lista de Compras Simples</h2>
    <p>Crie listas de compras, marque o que já comprou e compartilhe pelo WhatsApp. Sem cadastro e sem login.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.listadecompras.simples">Baixar no Google Play</a>
    <a class="btn ghost" href="/lista-compras/privacidade/">Política de privacidade</a>
  </div>
</main>
<footer>Contato: <a href="mailto:rbkaapps@gmail.com">rbkaapps@gmail.com</a></footer>
</body>
</html>
